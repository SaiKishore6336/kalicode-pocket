<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaliCode Pocket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <p class="eyebrow">PLAYGROUND / LIVE PREVIEW</p>
    <h1>Code anywhere.<br><span>Stay light.</span></h1>
    <p class="lede">This page is running from your phone. Edit the HTML, CSS, or JS,
      then tap Preview again to see the change.</p>

    <section class="card">
      <div class="row">
        <div>
          <p class="label">TAPS</p>
          <p class="count" id="count">0</p>
        </div>
        <button id="tap">Tap me</button>
      </div>
      <p class="hint" id="hint">Every tap is handled by app.js.</p>
    </section>

    <p class="footer">KaliCode Pocket · native editor · no Electron</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
